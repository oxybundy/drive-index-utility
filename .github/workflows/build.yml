name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: ./build.sh dmg

      - name: Check DMG
        run: |
          hdiutil verify build/DriveIndexUtility.dmg
          MOUNT=$(hdiutil attach build/DriveIndexUtility.dmg -nobrowse -noautoopen | grep -o '/Volumes/.*$' | tail -1)
          ls -la "$MOUNT"
          test -x "$MOUNT/Drive Index Utility.app/Contents/MacOS/DriveIndexUtility"
          test -L "$MOUNT/Applications"
          lipo -archs "$MOUNT/Drive Index Utility.app/Contents/MacOS/DriveIndexUtility"
          codesign --verify --deep --strict "$MOUNT/Drive Index Utility.app"
          hdiutil detach "$MOUNT"

      # Note: Actions artifacts always download as a .zip. The Release below is the plain .dmg.
      - uses: actions/upload-artifact@v4
        with:
          name: DriveIndexUtility
          path: build/DriveIndexUtility.dmg

      # Every push to main (or a v* tag) publishes the DMG as a GitHub Release, tagged with the
      # version in Resources/Info.plist. Re-pushing the same version replaces the DMG in place;
      # bump CFBundleShortVersionString to cut a new release.
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          fi
          # Release notes are this version's section of CHANGELOG.md.
          awk -v v="## ${TAG#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/DriveIndexUtility.dmg --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" build/DriveIndexUtility.dmg --target "$GITHUB_SHA" \
              --title "Drive Index Utility ${TAG#v}" --notes-file notes.md --latest
          fi
